
name: Benja Cloud PC - ULTRA PERFORMANCE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    name: Benja Windows Cloud
    runs-on: windows-2025
    timeout-minutes: 350

    env:
      TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

    steps:
      - name: Initialize Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================="
          Write-Host "       BENJA CLOUD PC"
          Write-Host "       ULTRA PERFORMANCE"
          Write-Host "=================================="

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "TAILSCALE_AUTH_KEY nao configurada."
          }

          $os = Get-CimInstance Win32_OperatingSystem
          $cpu = Get-CimInstance Win32_Processor
          $ram = Get-CimInstance Win32_ComputerSystem

          Write-Host "WINDOWS: $($os.Caption)"
          Write-Host "CPU: $($cpu.Name)"
          Write-Host "THREADS: $($cpu.NumberOfLogicalProcessors)"
          Write-Host "RAM: $([math]::Round($ram.TotalPhysicalMemory / 1GB, 2)) GB"

      - name: Configure Remote Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication -Value 1

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name SecurityLayer -Value 1

          Get-NetFirewallRule -DisplayName "Benja RDP Tailscale" `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          New-NetFirewallRule `
            -DisplayName "Benja RDP Tailscale" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Action Allow `
            -Profile Any

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Write-Host "RDP configured with NLA."

      - name: Create Benja Account
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $password = "Benja@1234"
          $secure = ConvertTo-SecureString $password -AsPlainText -Force

          $user = Get-LocalUser -Name "Benja" `
            -ErrorAction SilentlyContinue

          if ($user) {
            Set-LocalUser -Name "Benja" -Password $secure
            Enable-LocalUser -Name "Benja"
          }
          else {
            New-LocalUser `
              -Name "Benja" `
              -Password $secure `
              -PasswordNeverExpires `
              -AccountNeverExpires
          }

          $rdpGroup = Get-LocalGroup -SID "S-1-5-32-555"

          Add-LocalGroupMember `
            -Group $rdpGroup `
            -Member "Benja" `
            -ErrorAction SilentlyContinue

          Write-Host "Windows account Benja created."

      - name: Optimize Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Applying safe performance settings..."

          # High performance power plan
          powercfg /setactive SCHEME_MIN

          # Show system processor information
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores,
              NumberOfLogicalProcessors, LoadPercentage

          # Show memory information
          Get-CimInstance Win32_OperatingSystem |
            Select-Object TotalVisibleMemorySize,
              FreePhysicalMemory

          # Show storage information
          Get-CimInstance Win32_LogicalDisk |
            Select-Object DeviceID, Size, FreeSpace

          Write-Host "Performance checks completed."

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $installer

          $process = Start-Process msiexec.exe `
            -ArgumentList @("/i", $installer, "/qn", "/norestart") `
            -Wait -PassThru

          Remove-Item $installer -Force

          if ($process.ExitCode -ne 0) {
            throw "Tailscale installation failed."
          }

          if (!(Test-Path "C:\Program Files\Tailscale\tailscale.exe")) {
            throw "Tailscale executable not found."
          }

          Write-Host "Tailscale installed successfully."

      - name: Connect Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ts = "C:\Program Files\Tailscale\tailscale.exe"

          & $ts up `
            "--auth-key=$env:TS_AUTHKEY" `
            "--hostname=benja-cloud-$env:GITHUB_RUN_ID" `
            "--accept-dns=false"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          Start-Sleep -Seconds 10

          $tsIP = (& $ts ip -4 | Select-Object -First 1).Trim()

          if ([string]::IsNullOrWhiteSpace($tsIP)) {
            throw "Tailscale IP not received."
          }

          "TAILSCALE_IP=$tsIP" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Tailscale connected: $tsIP"

      - name: Verify Remote Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Start-Sleep -Seconds 5

          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (!$listener) {
            throw "RDP is not listening on port 3389."
          }

          Write-Host "RDP listener verified."
          Write-Host "Port: 3389"

      - name: Benja Cloud PC - Live
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $start = Get-Date
          $duration = 340
          $password = "Benja@1234"

          Write-Host ""
          Write-Host "======================================"
          Write-Host "        BENJA CLOUD PC ONLINE"
          Write-Host "======================================"
          Write-Host "STATUS: RUNNING"
          Write-Host "IP: $env:TAILSCALE_IP"
          Write-Host "PORT: 3389"
          Write-Host "NAME: Benja"
          Write-Host "PASSWORD: $password"
          Write-Host "======================================"

          while (((Get-Date) - $start).TotalMinutes -lt $duration) {

            $cpu = Get-CimInstance Win32_Processor
            $os = Get-CimInstance Win32_OperatingSystem
            $disk = Get-CimInstance Win32_LogicalDisk `
              -Filter "DeviceID='C:'"

            $usedRAM = [math]::Round(
              ($os.TotalVisibleMemorySize - $os.FreePhysicalMemory) / 1MB, 2
            )

            $totalRAM = [math]::Round(
              $os.TotalVisibleMemorySize / 1MB, 2
            )

            Write-Host ""
            Write-Host "========== LIVE MONITOR =========="
            Write-Host "STATUS: RUNNING"
            Write-Host "IP: $env:TAILSCALE_IP"
            Write-Host "NAME: Benja"
            Write-Host "PASSWORD: $password"
            Write-Host "CPU: $($cpu.LoadPercentage)%"
            Write-Host "RAM: $usedRAM / $totalRAM GB"
            Write-Host "DISK FREE: $([math]::Round($disk.FreeSpace / 1GB, 2)) GB"
            Write-Host "UPTIME: $([math]::Round(((Get-Date) - $start).TotalMinutes)) minutes"
            Write-Host "=================================="

            Start-Sleep -Seconds 60
          }

          Write-Host "Maximum runner session reached."
          
