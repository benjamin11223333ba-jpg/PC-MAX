
name: Benja Cloud PC - ULTRA PERFORMANCE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    name: Benja Windows Cloud
    runs-on: windows-2025
    timeout-minutes: 350

    env:
      TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

    steps:
      - name: Initialize Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (!$env:TS_AUTHKEY) {
            throw "Missing TAILSCALE_AUTH_KEY secret."
          }

          if (!$env:RDP_PASSWORD) {
            throw "Missing RDP_PASSWORD secret."
          }

          Write-Host "BENJA CLOUD PC - STARTING"

          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version

          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfLogicalProcessors

          Get-CimInstance Win32_ComputerSystem |
            Select-Object @{N="RAM_GB";E={[math]::Round($_.TotalPhysicalMemory / 1GB, 2)}}

      - name: Configure Remote Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication -Value 1

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name SecurityLayer -Value 1

          Get-NetFirewallRule -DisplayName "Benja RDP Tailscale" `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          New-NetFirewallRule `
            -DisplayName "Benja RDP Tailscale" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Action Allow `
            -Profile Any

          Set-Service TermService -StartupType Automatic
          Start-Service TermService

          Write-Host "RDP configured."

      - name: Create Benja User
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $secure = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $existing = Get-LocalUser -Name "Benja" `
            -ErrorAction SilentlyContinue

          if ($existing) {
            Set-LocalUser -Name "Benja" -Password $secure
            Enable-LocalUser -Name "Benja"
          }
          else {
            New-LocalUser `
              -Name "Benja" `
              -Password $secure `
              -AccountNeverExpires
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "Benja" `
            -ErrorAction SilentlyContinue

          Write-Host "User Benja configured."

      - name: Optimize Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Applying performance settings..."

          powercfg /setactive SCHEME_MIN

          Write-Host "High performance power plan requested."

          Get-CimInstance Win32_Processor |
            Select-Object Name, LoadPercentage

          Write-Host "Optimization checks completed."

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $installer

          $process = Start-Process msiexec.exe `
            -ArgumentList @("/i", $installer, "/qn", "/norestart") `
            -Wait -PassThru

          Remove-Item $installer -Force

          if ($process.ExitCode -ne 0) {
            throw "Tailscale installation failed."
          }

          if (!(Test-Path "C:\Program Files\Tailscale\tailscale.exe")) {
            throw "Tailscale executable not found."
          }

          Write-Host "Tailscale installed."

      - name: Connect Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ts = "C:\Program Files\Tailscale\tailscale.exe"

          & $ts up `
            "--auth-key=$env:TS_AUTHKEY" `
            "--hostname=benja-cloud-$env:GITHUB_RUN_ID" `
            "--accept-dns=false"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          Start-Sleep -Seconds 10

          $tsIP = (& $ts ip -4 | Select-Object -First 1).Trim()

          if (!$tsIP) {
            throw "No Tailscale IP received."
          }

          "TAILSCALE_IP=$tsIP" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Tailscale IP: $tsIP"

      - name: Keep Windows Running
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $start = Get-Date

          Write-Host ""
          Write-Host "================================"
          Write-Host "       BENJA CLOUD PC"
          Write-Host "================================"
          Write-Host "STATUS: RUNNING"
          Write-Host "USER: Benja"
          Write-Host "IP: $env:TAILSCALE_IP"
          Write-Host "PORT: 3389"
          Write-Host "PASSWORD: Configured"
          Write-Host "================================"

          while (((Get-Date) - $start).TotalMinutes -lt 340) {

            $cpu = Get-CimInstance Win32_Processor
            $os = Get-CimInstance Win32_OperatingSystem
            $disk = Get-CimInstance Win32_LogicalDisk `
              -Filter "DeviceID='C:'"

            $usedRAM = [math]::Round(
              ($os.TotalVisibleMemorySize - $os.FreePhysicalMemory) / 1MB, 2
            )

            $totalRAM = [math]::Round(
              $os.TotalVisibleMemorySize / 1MB, 2
            )

            Write-Host ""
            Write-Host "========== LIVE STATUS =========="
            Write-Host "STATUS: RUNNING"
            Write-Host "TIME: $(Get-Date -Format 'HH:mm:ss')"
            Write-Host "IP: $env:TAILSCALE_IP"
            Write-Host "USER: Benja"
            Write-Host "CPU LOAD: $($cpu.LoadPercentage)%"
            Write-Host "RAM: $usedRAM / $totalRAM GB"
            Write-Host "DISK FREE: $([math]::Round($disk.FreeSpace / 1GB, 2)) GB"
            Write-Host "================================="

            Start-Sleep -Seconds 60
          }

          Write-Host "Runner time limit reached."
          
